name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            target: aarch64-apple-darwin
            # Build .app only; we package a user-friendly DMG ourselves
            # (ad-hoc sign + one-click Install script that clears quarantine).
            bundle: app

          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            bundle: msi

          # Future Linux builds can be added here
          # - os: ubuntu-24.04
          #   platform: linux
          #   target: x86_64-unknown-linux-gnu
          #   bundle: deb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux dependencies (when enabled)
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            nasm

      # Windows NASM
      - name: Setup NASM (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/setup-nasm@v1

      # macOS NASM
      - name: Setup NASM (macOS)
        if: matrix.platform == 'macos'
        run: brew install nasm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}

      # macOS: package friendly DMG (ad-hoc sign + Install PhotoMind.command)
      - name: Package macOS DMG
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          chmod +x scripts/macos/package-dmg.sh
          ./scripts/macos/package-dmg.sh \
            src-tauri/target/release/bundle/macos/PhotoMind.app \
            "$TAG" \
            src-tauri/target/release/bundle/dmg
          ls -lh src-tauri/target/release/bundle/dmg/*.dmg

      # Find and upload DMG (macOS)
      - name: Upload DMG artifact
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMind-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      # Find and upload MSI (Windows)
      - name: Upload MSI artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMind-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts/

      - name: Get version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Create release notes
        run: |
          NOTES="RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" release_notes.md
          else
            printf '# PhotoMind %s\n\nLocal photo organization for macOS and Windows. Face detection and possible same-person grouping run on the device with a bundled model. No LLM or account is needed.\n' "${GITHUB_REF_NAME#v}" > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PhotoMind ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
