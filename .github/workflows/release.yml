name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            target: aarch64-apple-darwin
            # Build .app only; we package a user-friendly DMG ourselves
            # (ad-hoc sign + one-click Install script that clears quarantine).
            bundle: app

          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            bundle: msi

          # Future Linux builds can be added here
          # - os: ubuntu-24.04
          #   platform: linux
          #   target: x86_64-unknown-linux-gnu
          #   bundle: deb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux dependencies (when enabled)
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            nasm

      # Windows NASM (when enabled)
      - name: Setup NASM (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/setup-nasm@v1

      # macOS NASM
      - name: Setup NASM (macOS)
        if: matrix.platform == 'macos'
        run: brew install nasm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}

      # macOS: package friendly DMG (ad-hoc sign + Install PhotoMind.command)
      - name: Package macOS DMG
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          chmod +x scripts/macos/package-dmg.sh
          ./scripts/macos/package-dmg.sh \
            src-tauri/target/release/bundle/macos/PhotoMind.app \
            "$TAG" \
            src-tauri/target/release/bundle/dmg
          ls -lh src-tauri/target/release/bundle/dmg/*.dmg

      # Find and upload DMG (macOS)
      - name: Upload DMG artifact
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMind-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      # Find and upload MSI (Windows)
      - name: Upload MSI artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMind-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # Find and upload DEB (Linux - future)
      # - name: Upload DEB artifact
      #   if: matrix.platform == 'linux'
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: PhotoMind-${{ matrix.platform }}
      #     path: src-tauri/target/release/bundle/deb/*.deb
      #     if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts/

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Create release notes
        id: notes
        run: |
          cat > release_notes.md << 'EOF'
          # PhotoMind ${{ steps.version.outputs.version }}

          **Free, open-source, local-first photo culling and selection for photographers.**

          ## What's New in v${{ steps.version.outputs.version }}

          - macOS one-click installer that clears Gatekeeper quarantine
          - Windows MSI installer
          - Local-first photo culling (duplicates, similar shots, moments, quality)

          ### Eye Analysis Status

          Face detection works. Eye-state analysis is experimental and **does not affect ranking** while validation is ongoing.

          ### Supported Formats

          JPEG, PNG, RAW (CR2, CR3, NEF, ARW, RAF, ORF, RW2, PEF, SRW, DNG), HEIC/HEIF, AVIF

          ## Installation

          ### macOS

          1. Download `PhotoMind_${{ steps.version.outputs.version }}_macOS.dmg`
          2. Open the DMG
          3. Double-click `Install PhotoMind.app` → click Done on the warning
          4. System Settings → Privacy & Security → **Open Anyway**
             Or double-click `install-via-terminal.command`

          See [macOS Release Notes](https://github.com/neervasa00000000/PhotoMind/blob/main/docs/MACOS_RELEASE.md).

          ### Windows

          1. Download the `.msi` from this release
          2. Run the installer
          3. If SmartScreen appears: More info → Run anyway

          ### Linux

          Coming in a future release.

          ## Requirements

          - macOS 11+ or Windows 10+
          - No Node.js, Rust, or Ollama required
          - Works completely offline

          ## Known Issues

          - Not Apple-notarized / not Microsoft-signed (use the installers above)
          - HEIC/HEIF pixel analysis incomplete
          - Eye analysis experimental (disabled for ranking)

          ## Privacy

          PhotoMind processes photos locally. No data leaves your computer unless you explicitly enable optional Ollama integration.

          ---

          **Full Changelog:** https://github.com/neervasa00000000/PhotoMind/commits/${{ steps.version.outputs.tag }}
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PhotoMind ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.deb
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
