name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri v2 runtime/build dependencies (Linux only).
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            nasm

      # rav1e's x86_64 assembly backend needs nasm on Windows too.
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build frontend
        run: npm run build

      # Fixture-gated decoder tests skip (and stay green) when the dev-only
      # `src-tauri/fixtures/` samples are absent, so no network is required.
      - name: Rust test suite
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # The cleanup planner regression is plain Node, independent of the crate.
      - name: Cleanup planner regression
        run: node --experimental-strip-types .qa/cleanup.test.ts
